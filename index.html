<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剑火纪元</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f2e8d6;
            color: #4b3621;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 16px;
            max-width: 750px;
            margin: 0 auto;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            margin-bottom: 16px;
            font-size: 15px;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }
        .ai-bubble {
            background-color: #e8d9c0;
            padding: 18px;
            border-radius: 14px;
            line-height: 1.7;
            font-size: 16px;
        }
        /* 自动生成的可点击选项按钮区域 */
        .option-wrap {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin:14px 0;
        }
        .action-option {
            padding:12px 16px;
            border: 1px solid #b8a488;
            border-radius: 10px;
            background-color: #efe5d3;
            cursor: pointer;
            text-align: left;
            font-size:15px;
            transition: 0.2s;
        }
        .action-option:hover {
            background-color: #e2d3bb;
        }
        .input-area {
            display: flex;
            gap:10px;
            position: sticky;
            bottom:10px;
            background:#f2e8d6;
            padding-top:10px;
        }
        #user-input {
            flex: 1;
            padding:14px;
            border:1px solid #b8a488;
            border-radius:10px;
            font-size:16px;
            background:#fff9ec;
        }
        #send-btn {
            padding:0 20px;
            border:none;
            border-radius:10px;
            background:#b88646;
            color:white;
            font-size:16px;
            cursor:pointer;
        }
        .user-bubble {
            align-self: flex-end;
            background-color: #d4c0a3;
            padding:12px 16px;
            border-radius:12px;
            max-width:85%;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <span>年龄：18｜声望：0｜财富：69</span>
        <span>第七纪元·元年·3月</span>
    </div>

    <div class="chat-container" id="chat-box">
        <!-- AI剧情、选项会动态渲染在这里 -->
    </div>

    <div class="input-area">
        <input id="user-input" placeholder="你要做什么？">
        <button id="send-btn">发送</button>
    </div>

<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

let generator = null;
const chatBox = document.getElementById("chat-box");
const userInput = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");

// 初始化加载模型
async function loadModel() {
    alert("正在加载本地AI模型，首次加载较慢，请耐心等待！");
    generator = await pipeline('text-generation', 'Xenova/Qwen1.5-1.8B-Chat');
    startGame();
}

// 开局剧情
async function startGame() {
    const prompt = `【剑火纪元 开局】
你是文字TRPG主持人。每次回复规则：
1. 先描写剧情文本
2. 剧情结束后，生成3条不同可行的行动选项，每条单独一行，格式：【选项内容】
3. 玩家可以点击选项，或者自己输入自定义行动
4. 风格复古中式奇幻，贴合截图示例文风
开局剧情：你今年18岁，财富69，声望0，身处第七纪元元年3月。你看到一则告示：【古物爱好者寻人】：“本人正在寻找一位不惧矿洞深处低温的助手，协助测量矿区地磁读数。酬劳丰厚，风险自负。”——字迹潦草，纸张带着一股陈旧的霉味，与那个‘守书人’给你的感觉极为相似。
请按照规则输出剧情+3条行动选项`;
    await runAi(prompt, true);
}

// AI生成内容并渲染剧情+选项
async function runAi(userText, isInit = false) {
    if(!isInit) addUserMsg(userText);
    const result = await generator(userText, {
        max_new_tokens: 512,
        temperature: 0.7,
    });
    const aiFullText = result[0].generated_text;
    renderAiContent(aiFullText);
}

// 渲染AI剧情 + 解析生成可点击选项
function renderAiContent(text) {
    const wrap = document.createElement("div");
    wrap.className = "ai-bubble";
    const optionContainer = document.createElement("div");
    optionContainer.className = "option-wrap";

    // 分割【】包裹的选项
    const reg = /【([^】]+)】/g;
    let match;
    let plainText = text.replace(reg, "");
    wrap.innerText = plainText;

    // 提取所有选项，生成点击按钮
    while ((match = reg.exec(text)) !== null) {
        const btn = document.createElement("button");
        btn.className = "action-option";
        btn.innerText = match[1];
        btn.onclick = ()=>{
            userInput.value = match[1];
            sendAction();
        }
        optionContainer.appendChild(btn);
    }
    chatBox.appendChild(wrap);
    chatBox.appendChild(optionContainer);
    window.scrollTo(0, document.body.scrollHeight);
}

// 添加玩家发出的消息
function addUserMsg(text) {
    const userDom = document.createElement("div");
    userDom.className = "user-bubble";
    userDom.innerText = text;
    chatBox.appendChild(userDom);
}

// 发送动作
function sendAction() {
    const content = userInput.value.trim();
    if(!content || !generator) return;
    userInput.value = "";
    runAi(`玩家行动：${content}。继续推进剧情，结尾给出3条新的【行动选项】`);
}

sendBtn.onclick = sendAction;
userInput.addEventListener("keydown", e=>{
    if(e.key === "Enter") sendAction();
})

loadModel();
</script>
</body>
</html>
